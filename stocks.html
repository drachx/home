  function unpack() {
    var bin = atob(B64);
    var u8 = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) u8[i] = bin.charCodeAt(i);
    return new TextDecoder("utf-8").decode(u8);
  }
  var launched = false;
  function runApp() {
    if (launched) return;
    try {
      var page = unpack();
      launched = true;
      document.open("text/html", "replace");
      document.write(page);
      document.close();
    } catch (e) {
      var el = document.getElementById("err");
      if (el) el.textContent = "Decode error: " + (e && e.message ? e.message : String(e));
    }
  }
  var btn = document.getElementById("openBtn");
  var inp = document.getElementById("keyInput");
  if (btn) btn.addEventListener("click", runApp);
  if (inp) inp.addEventListener("keydown", function(e){ if (e.key === "Enter") runApp(); });
  setTimeout(runApp, 25);
})();
